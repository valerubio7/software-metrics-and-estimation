project:
  name: software-metrics-and-estimation
  description: Agile project management application focused on software metrics, estimation, effort tracking, defects, dashboards, and reports.
  primary_language: go
  current_stage: mvp-parcial-backend

sdd:
  artifact_store: openspec
  execution_mode: interactive
  delivery_strategy: single-pr
  review_budget_lines: 400
  strict_tdd: true
  test_command: go test ./...

testing:
  projects:
    - path: .
      stack: Go
      test_command: go test ./...
      test_layers:
        - layer: integration
          framework: Testcontainers
          prerequisites:
            - Docker
      coverage_command: null
      quality_tools:
        linter: null
        type_checker: null
        formatter: null

conventions:
  technical_artifacts_language: es
  source_control:
    commit_style: conventional-commits

notes:
  - MVP parcial de backend Go/PostgreSQL con módulos de proyectos, historias y Sprints; no representa la aplicación completa de la consigna.
  - "Implementadas: US-01, US-02, US-05, US-06, US-07 y US-08 (crear/modificar proyectos e historias, consultar backlog y crear Sprint)."
  - Las historias se siguen como issues de GitHub y las épicas se representan como milestones.
  - Las migraciones se aplican externamente; schema_migrations condiciona la disponibilidad de rutas opcionales al arrancar.
  - Hay dos migraciones numeradas 000003 en el directorio compartido; su reconciliación y la validación del despliegue siguen pendientes.
