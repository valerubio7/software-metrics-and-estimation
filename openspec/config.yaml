project:
  name: software-metrics-and-estimation
  description: Agile project management application focused on software metrics, estimation, effort tracking, defects, dashboards, and reports.
  primary_language: go
  current_stage: mvp-backend-con-tui
  frameworks:
    - Bubbletea (TUI, cmd/tui, internal/tui)
    - pgx/v5 + PostgreSQL (cmd/api, internal/*/infrastructure/postgres)
    - go-pdf/fpdf (reportes PDF)

sdd:
  artifact_store: openspec
  execution_mode: interactive
  delivery_strategy: single-pr
  review_budget_lines: 400
  strict_tdd: true
  test_command: go test ./...

testing:
  projects:
    - path: .
      stack: Go
      test_command: go test ./...
      test_layers:
        - layer: integration
          framework: Testcontainers
          prerequisites:
            - Docker
      coverage_command: null
      quality_tools:
        linter: null
        type_checker: null
        formatter: null

conventions:
  technical_artifacts_language: es
  source_control:
    commit_style: conventional-commits

notes:
  - MVP de backend Go/PostgreSQL más TUI Bubbletea (cmd/tui); el estado archivado vive en openspec/changes/archive y las specs consolidadas en openspec/specs (defecto, esfuerzo, historia, metricas, project, reporte, sprint, tarea, tui).
  - "Backend archivado: US-01 a US-04, US-05 a US-13, US-15, US-16, US-18, US-19 y US-21 (proyectos, miembros, estado, historias, backlog, Sprints, tareas, esfuerzo, defectos, métricas, reporte PDF)."
  - "TUI archivada: TUI-01, TUI-02, TUI-03, TUI-06, TUI-08, TUI-11, TUI-12 y TUI-13 (navegación, proyectos, backlog, sprint, esfuerzo, dashboard, rediseño UX y limpieza de la spec) y el cambio tui-refactor-acciones-desde-historia (detalle de la historia con las acciones Estimar, Registrar esfuerzo y Reportar defecto; la TUI queda con cuatro pestañas)."
  - "Estructura: cmd/{api,tui}, internal/<módulo>/{domain,application,infrastructure,transport}, tests/{unit,integration}; las pruebas de integración usan Testcontainers y requieren Docker."
  - Las historias se siguen como issues de GitHub y las épicas se representan como milestones.
  - Las migraciones se aplican externamente; schema_migrations condiciona la disponibilidad de rutas opcionales al arrancar.
  - El directorio compartido de migraciones contiene 14 pares 000001–000014 sin números duplicados (lo verifica migration_files_test.go); el despliegue de las migraciones es externo.
