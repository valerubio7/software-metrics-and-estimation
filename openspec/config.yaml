project:
  name: software-metrics-and-estimation
  description: Agile project management application focused on software metrics, estimation, effort tracking, defects, dashboards, and reports.
  primary_language: go
  current_stage: initial-skeleton

sdd:
  artifact_store: openspec
  execution_mode: interactive
  delivery_strategy: single-pr
  review_budget_lines: 400
  strict_tdd: true
  test_command: go test ./...

testing:
  projects:
    - path: .
      stack: Go
      test_command: go test ./...
      test_layers:
        - layer: integration
          framework: Testcontainers
          prerequisites:
            - Docker
      coverage_command: null
      quality_tools:
        linter: null
        type_checker: null
        formatter: null

conventions:
  technical_artifacts_language: en
  source_control:
    commit_style: conventional-commits

notes:
  - The repository is currently a skeletal Go module with empty domain package directories.
  - User stories are tracked as GitHub issues and epics are represented as GitHub milestones.
